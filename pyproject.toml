[project]
name = "volclust"
version = "0.1.0"
description = "Volatility clustering research project (reproducing and extending Cont, 2001)"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "scipy", "statsmodels", "matplotlib", "arch", "yfinance", "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
